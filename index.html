<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Nike</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
        <h1>Tienda Nike</h1>
   
<main class="main-content">

    <section class="productos-section">

        <div class="productos-grid">

            <div class="product-card">
                <img src="https://zshopp.com/wp-content/uploads/2024/08/Tenis-Zapatillas-Nike-Air-Max-2000-Para-Mujer.webp">
                <div class="product-info">
                    <h3>Tenis NIKE</h3>
                    <p>Comodidad y estilo</p>
                    <span>$20.00</span>
                    <button>🛒 Comprar</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://metasportscspvmsdiag.blob.core.windows.net/azdiagextnresults/catalog/product/cache/9286ff1d9737d1c21559f7da6b69729b/nike/equipment/DR6091629-1.jpg">
                <div class="product-info">
                    <h3>Mochila NIKE</h3>
                    <p>Estilo y tendencia</p>
                    <span>$50.00</span>
                    <button>🛒 Comprar</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://dam.elcorteingles.es/producto/www-001088730403156-s0.jpg?impolicy=frontWeb&width=1200">
                <div class="product-info">
                    <h3>Conjunto NIKE</h3>
                    <p>Cómodo y ligero para uso diario</p>
                    <span>$60.00</span>
                    <button>🛒 Comprar</button>
                </div>
            </div>

        </div>

    </section>

</main>

</body>
</html>
